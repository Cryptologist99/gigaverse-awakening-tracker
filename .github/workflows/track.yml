name: Track Gigaverse Awakening

on:
  # Scheduling now lives on the always-on Raspberry Pi (`botbot`), which runs
  # this same snapshot via cron at exactly 1:59 AM & 1:59 PM US Eastern and
  # pushes the CSVs directly — GitHub's scheduler was too imprecise (runs were
  # delayed by hours and even skipped). This workflow is kept as a MANUAL
  # trigger only, so there are no duplicate, off-time scheduled runs.
  workflow_dispatch: {}   # trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Take snapshot
        run: python track_awakening.py

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Snapshot: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push
