name: Track Gigaverse Awakening

on:
  schedule:
    # Every hour, at minute 5. Cron is UTC. Adjust as you like (see README).
    - cron: "5 * * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Take snapshot
        run: python track_awakening.py

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Snapshot: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push
