name: Track Gigaverse Awakening

on:
  schedule:
    # Cron is UTC. The Awakening event (Aug 10 – Oct 9 2026) runs entirely
    # within US Daylight Time (EDT = UTC-4; DST doesn't end until Nov 2), so
    # these fixed UTC times ARE 1:59 AM / 1:59 PM US Eastern for the whole event.
    # No DST gate: GitHub often delays scheduled runs (sometimes by hours), and
    # a gate that checks the clock at run time would skip a delayed run entirely.
    # Running unconditionally means a late run still records its snapshot.
    - cron: "59 5 * * *"    # 1:59 AM Eastern (EDT)
    - cron: "59 17 * * *"   # 1:59 PM Eastern (EDT)
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Take snapshot
        run: python track_awakening.py

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Snapshot: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push
